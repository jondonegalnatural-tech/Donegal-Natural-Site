<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donegal Natural | Wholesale Portal Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f8f1e9 0%, #e8d9c9 100%);
        }
        .login-card {
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            border: 3px solid #6B4423;
        }
        .btn-brand {
            background-color: #1E4D2B;
            color: #d4b78f;
            border: 2px solid #6B4423;
            transition: all 0.2s ease;
        }
        .btn-brand:hover {
            background-color: #254a2f;
        }
        .form-input {
            border: 2px solid #6B4423;
            border-radius: 12px;
        }
        .form-input:focus {
            outline: none;
            border-color: #1E4D2B;
            box-shadow: 0 0 0 3px rgba(30, 77, 43, 0.15);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo and Header -->
        <div class="text-center mb-8">
            <div class="flex justify-center mb-4">
                <img src="media/logo.png" alt="Donegal Natural Dog Treats" class="h-20 w-auto">
            </div>
            <h1 class="text-3xl font-bold tracking-tight" style="color:#1E4D2B;">Donegal Natural</h1>
            <p style="color:#6B4423; margin-top:0.25rem;">Wholesale Portal Login</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-3xl p-8 login-card">
            <h2 class="text-2xl font-semibold mb-6 text-center" style="color:#1E4D2B;">Sign in to your account</h2>

            <form id="loginForm" class="space-y-6">
                <!-- Username / Email -->
                <div>
                    <label class="block text-sm font-semibold mb-2" style="color:#6B4423;">Email or Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-user" style="color:#6B4423;"></i>
                        </div>
                        <input type="text" id="username" required
                               class="form-input block w-full pl-10 pr-3 py-3"
                               placeholder="Enter your email or username">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm font-semibold mb-2" style="color:#6B4423;">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-lock" style="color:#6B4423;"></i>
                        </div>
                        <input type="password" id="password" required
                               class="form-input block w-full pl-10 pr-3 py-3"
                               placeholder="Enter your password">
                    </div>
                </div>

                <!-- Error Message -->
                <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-2xl text-sm">
                    <i class="fas fa-exclamation-circle mr-2"></i>
                    <span id="errorText"></span>
                </div>

                <!-- Login Button -->
                <button type="submit"
                        class="w-full btn-brand font-bold py-3.5 px-4 rounded-2xl flex items-center justify-center gap-2 text-base">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Sign In</span>
                </button>
            </form>
        </div>

        <p class="text-center text-xs mt-8" style="color:#6B4423;">
            © 2026 Donegal Natural Dog Treats. All rights reserved.
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/login-portal.js"></script>
</body>
</html>
